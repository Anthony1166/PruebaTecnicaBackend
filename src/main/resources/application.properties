# Por defecto Spring Boot oculta el mensaje real de las excepciones en la
# respuesta de error (queda "No message available"). Lo habilitamos porque
# el frontend muestra ese mensaje al usuario (SKU duplicado, categoria con
# productos asociados, etc.).
spring.web.error.include-message=always